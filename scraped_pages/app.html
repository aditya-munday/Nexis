<!DOCTYPE html><html lang="en" class="font-sans geist_f3917156-module__8abXJW__variable geist_mono_8135f3c4-module__mC3Wtq__variable"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="/_next/static/chunks/0_lip61trs5ex.css" data-precedence="next"/><link rel="stylesheet" href="/_next/static/chunks/0z2w9nzo7p43w.css" data-precedence="next"/><link rel="stylesheet" href="/_next/static/chunks/0nignvb3.d029.css" data-precedence="next"/><link rel="preload" href="/_next/static/chunks/14d9izr73949a.css" as="style"/><link rel="preload" href="/_next/static/chunks/04kuxjfu0zhd0.css" as="style"/><link rel="preload" href="/_next/static/chunks/01utgtykga2_a.css" as="style"/><title>Nexis Agent Platform</title><meta name="description" content="Production web shell for the Nexis autonomous agent platform."/><link rel="icon" href="/icon.svg?icon.10.c5ml-5jy6k.svg" sizes="any" type="image/svg+xml"/><meta name="next-size-adjust" content=""/></head><body class="inter_d50ff178-module__JsvCAG__variable" style="margin:0"><div hidden=""><!--$--><!--/$--></div>



<script src="/unicornStudio.umd.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Init Unicorn Studio WebGL if available
  if (window.UnicornStudio) {
    try {
      window.UnicornStudio.init();
    } catch(err) {
      console.warn('UnicornStudio WebGL fallback:', err);
    }
  }

  // Copy Buttons
  const policyCode = `import { policy } from "@nexis/agent"
export const treasury = policy({
  dailyLimit: "25,000 USDC",
  perTx: "5,000 USDC",
  allowlist: recipients,
  approvals: "above 1,000",
})`;

  const cliCode = `nex run \
  playbooks/treasury.toml \
  --simulate \
  --require-approval \
  --receipts out/`;

  document.querySelectorAll('button[aria-label="Copy Policy Kit code"]').forEach(btn => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(policyCode);
      btn.style.color = '#4ade80';
      setTimeout(() => { btn.style.color = ''; }, 2000);
    });
  });

  document.querySelectorAll('button[aria-label="Copy Nex CLI command"]').forEach(btn => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(cliCode);
      btn.style.color = '#4ade80';
      setTimeout(() => { btn.style.color = ''; }, 2000);
    });
  });

  // Smooth scroll
  document.querySelectorAll('a[href^="/#"], a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const href = a.getAttribute('href');
      const hash = href.startsWith('/#') ? href.substring(1) : href;
      if (hash && hash.startsWith('#')) {
        const target = document.querySelector(hash);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth' });
        }
      }
    });
  });

  // Mobile menu
  const mobBtn = document.querySelector('button[aria-label="Open menu"], button[aria-label="Close menu"]');
  if (mobBtn) {
    let open = false;
    let menuOverlay = null;

    mobBtn.addEventListener('click', () => {
      open = !open;
      mobBtn.setAttribute('aria-expanded', String(open));
      mobBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      
      const lines = mobBtn.querySelectorAll('span.absolute');
      if (lines.length >= 2) {
        lines[0].style.opacity = open ? '1' : '0';
        lines[0].style.pointerEvents = open ? 'auto' : 'none';
        lines[1].style.opacity = open ? '0' : '1';
      }

      if (open) {
        if (!menuOverlay) {
          menuOverlay = document.createElement('div');
          menuOverlay.className = 'xl:hidden fixed inset-x-0 top-16 bottom-0 z-40 bg-black/95 backdrop-blur-2xl px-6 py-8 flex flex-col justify-between overflow-y-auto border-t border-white/10';
          menuOverlay.innerHTML = `
            <nav class="flex flex-col gap-6">
              <a href="/#platform" class="font-favorit text-lg uppercase tracking-wider text-white/80 hover:text-white">01 Platform</a>
              <a href="/#payments" class="font-favorit text-lg uppercase tracking-wider text-white/80 hover:text-white">02 Payments</a>
              <a href="/#markets" class="font-favorit text-lg uppercase tracking-wider text-white/80 hover:text-white">03 Markets</a>
              <a href="/#research" class="font-favorit text-lg uppercase tracking-wider text-white/80 hover:text-white">04 Research</a>
              <div class="h-px bg-white/10 my-2"></div>
              <a href="/benchmarks" class="font-favorit text-sm uppercase text-white/60 hover:text-white">Benchmarks</a>
              <a href="/docs" class="font-favorit text-sm uppercase text-white/60 hover:text-white">Documentation</a>
              <a href="/blog" class="font-favorit text-sm uppercase text-white/60 hover:text-white">Blog</a>
              <a href="/about" class="font-favorit text-sm uppercase text-white/60 hover:text-white">About</a>
            </nav>
            <div class="flex flex-col gap-3 pt-6 border-t border-white/10">
              <a href="/app" class="flex items-center justify-center py-3 border border-white/20 bg-white/10 font-favorit text-sm uppercase text-white hover:bg-white/20">Login</a>
              <a href="/app" class="flex items-center justify-center py-3 bg-white font-favorit text-sm uppercase text-black hover:bg-white/90">Launch Nexis</a>
            </div>
          `;
          document.body.appendChild(menuOverlay);

          menuOverlay.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
              open = false;
              menuOverlay.remove();
              menuOverlay = null;
              if (lines.length >= 2) {
                lines[0].style.opacity = '0';
                lines[1].style.opacity = '1';
              }
            });
          });
        }
      } else if (menuOverlay) {
        menuOverlay.remove();
        menuOverlay = null;
      }
    });
  }
});
</script>
</body></html>
